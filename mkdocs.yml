site_name: El Sibarita
site_url: https://sibarita.xyz/
site_description: Recetas caseras clasificadas por origen, aporte nutricional y comida del día.
docs_dir: docs

extra_css:
  - https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&family=Roboto+Mono&display=swap
  - stylesheets/extra.css

theme:
  name: material
  language: es
  font: false
  icon:
    logo: material/chef-hat
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search
  - tags:
      tags_hierarchy: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Recetas:
      - recetas/index.md
      - Milanesa: recetas/milanesa.md
      - Chipa: recetas/chipa.md
      - Panqueques de avena: recetas/panqueques-de-avena.md
      - Guiso de lentejas: recetas/guiso-de-lentejas.md
      - Tortilla de papas: recetas/tortilla-de-papas.md
      - Ñoquis de papa: recetas/noquis-de-papa.md
      - Granola: recetas/granola.md
      - Granola simple: recetas/granola-simple.md
      - Trufas de coco: recetas/trufas-de-coco.md
  - Etiquetas: tags.md
  - Contribuir: contribuir.md
